<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/MA.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MhmdAlfrzi-Portfolio</title>
    <script>
      (function() {
        function fixGradientText() {
          document.querySelectorAll('.name-gradient, .section-title, .logo-text').forEach(el => {
            if (el.style.webkitTextFillColor === 'transparent') {
              el.style.webkitTextFillColor = 'transparent';
            }
          });
        }        
        if (document.body) {
          const observer = new MutationObserver(fixGradientText);
          observer.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
        
        document.addEventListener('DOMContentLoaded', fixGradientText);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
